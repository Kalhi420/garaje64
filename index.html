<style>
/* lo que en claude.ai pone el contenedor de la página */
html{color-scheme:light;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: app de bolsillo — cabecera fija, cuadrícula de "blísters", barra inferior con botón de escaneo al centro */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunken:#E2E7EC; --line:#CBD3DB;
  --ink:#14202B; --muted:#5A6B7A; --accent:#E8530E; --accent-ink:#FFFFFF;
  --blue:#1B4F9C; --gold:#B8860B; --ok:#1E7B4A; --warn:#B4530A; --bad:#B42318;
  --shadow:0 1px 2px rgba(20,32,43,.08),0 4px 14px rgba(20,32,43,.06);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F161D; --surface:#18222C; --sunken:#121A22; --line:#2A3946;
  --ink:#E8EEF3; --muted:#93A4B3; --accent:#FF6A26; --accent-ink:#1A0A02;
  --blue:#6FA3F0; --gold:#E2B33C; --ok:#4CC383; --warn:#F0A04B; --bad:#F2716A;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161D; --surface:#18222C; --sunken:#121A22; --line:#2A3946;
  --ink:#E8EEF3; --muted:#93A4B3; --accent:#FF6A26; --accent-ink:#1A0A02;
  --blue:#6FA3F0; --gold:#E2B33C; --ok:#4CC383; --warn:#F0A04B; --bad:#F2716A;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* cabecera */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:900;font-size:28px;letter-spacing:.5px;line-height:1;display:flex;align-items:baseline;gap:6px;text-transform:uppercase}
.brand b{color:#FF6A26}
.brand small{font-family:var(--f-label);font-size:11px;letter-spacing:1.5px;font-weight:600;opacity:.65}
.mode{white-space:nowrap;margin-left:auto;font-family:var(--f-label);font-size:12px;letter-spacing:.8px;text-transform:uppercase;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:4px 10px;background:transparent;color:#fff;display:flex;gap:6px;align-items:center}
.mode i{width:8px;height:8px;border-radius:50%;background:#4CC383;display:inline-block}
.mode.cloud i{background:#6FA3F0}
@media(max-width:430px){.brand small{display:none}.mode{padding:6px 8px}.mode span{display:none}}
.gear{background:transparent;border:0;color:#fff;width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.gear svg{width:22px;height:22px}
/* catálogo */
.prog{height:10px;background:var(--sunken);border-radius:5px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:5px}
.cat{display:flex;flex-direction:column;margin-top:12px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.crow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .no{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.crow .no small{display:block;font-family:var(--f-label);font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.5px}
.crow .tx{min-width:0}
.crow .tx b{display:block;line-height:1.25;overflow-wrap:anywhere}
.crow .tx span{font-size:13px;color:var(--muted)}
.crow .tx a{font-size:13px;color:var(--blue);margin-left:6px}
.crow .tx .codes{display:block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.3px}
.crow .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.crow.have{background:color-mix(in srgb,var(--ok) 7%,var(--surface))}
.have-pill{font-family:var(--f-label);font-weight:700;font-size:13px;color:var(--ok);border:1px solid currentColor;border-radius:99px;padding:5px 10px;background:transparent}
.want-pill{font-family:var(--f-label);font-weight:700;font-size:13px;color:var(--accent);border:1px solid currentColor;border-radius:99px;padding:5px 10px;background:transparent}
@media(max-width:420px){.crow{grid-template-columns:44px 1fr}.crow .act{grid-column:2;justify-content:flex-start}}

main{padding-block:16px 110px}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.4px;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:34px;font-weight:900}
h2{font-size:24px;font-weight:800}
h3{font-size:18px;font-weight:800}
.label{font-family:var(--f-label);text-transform:uppercase;letter-spacing:1px;font-size:12px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}

/* barra de búsqueda y filtros */
.search{display:flex;gap:8px;margin-block:12px}
.search input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.search select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 8px;max-width:42%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-family:var(--f-label);font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}

.banner{background:var(--sunken);border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.banner p{margin:0;flex:1;min-width:180px}
.banner.warn{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-style:solid}

/* cuadrícula de autos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;margin-top:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;text-align:left;border:0;padding:0;display:flex;flex-direction:column;min-width:0;position:relative}
.card .ph{aspect-ratio:4/3;max-width:100%;background:var(--sunken);display:grid;place-items:center;position:relative;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .ph svg{width:78%;height:auto}
.card .meta{padding:9px 10px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .nm{font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{position:absolute;top:6px;left:6px;right:6px;display:flex;gap:4px;justify-content:space-between;pointer-events:none}
.tags .l,.tags .r{display:flex;gap:4px}
.tag{font-family:var(--f-label);font-weight:700;font-size:11px;letter-spacing:.6px;padding:2px 6px;border-radius:5px;background:var(--surface);color:var(--ink);text-transform:uppercase;box-shadow:0 1px 2px rgba(0,0,0,.15);white-space:nowrap}
.tag.th{background:var(--blue);color:#fff}
.tag.sth{background:var(--gold);color:#1a1200}
.tag.wish{background:var(--accent);color:var(--accent-ink)}
.tag.qty{background:var(--ink);color:var(--bg)}
.tag.ex{background:var(--sunken);color:var(--muted)}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:6px}

/* barra inferior */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.bottom button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-label);font-size:12px;font-weight:600;letter-spacing:.4px;color:var(--muted);text-transform:uppercase}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button[aria-current="page"]{color:var(--accent)}
nav.bottom .scan{position:relative;top:-14px}
nav.bottom .scan span.dot{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 14px rgba(232,83,14,.4);border:4px solid var(--bg)}
nav.bottom .scan{color:var(--ink)}

/* botones */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad);border-color:currentColor;background:transparent}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}

/* hoja modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:6px auto 12px}
.sheet-h{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sheet-h h2{flex:1}
.x{background:var(--sunken);border:0;width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}

/* formulario */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px;width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.seg{display:flex;background:var(--sunken);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 4px;font-family:var(--f-label);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
.photo-in{display:flex;gap:12px;align-items:center}
.photo-in .pv{width:112px;aspect-ratio:4/3;border-radius:10px;background:var(--sunken);overflow:hidden;display:grid;place-items:center;flex:none}
.photo-in .pv img{width:100%;height:100%;object-fit:cover}
.photo-in .pv svg{width:80%}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.check{display:flex;gap:8px;align-items:center;padding:6px 0}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.listpick{display:flex;flex-wrap:wrap;gap:6px}
.form-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.form-actions .btn{flex:1}
.form.quick .adv{display:none}
.form.quick .f{grid-column:1/-1}
.form.quick .photo-in .pv{width:150px}
.idcard{background:var(--surface);border-radius:12px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:4px;border-left:4px solid var(--accent)}
.idcard .nm{font-size:18px;line-height:1.2}
.linkbtn{background:none;border:0;padding:4px 0 0;color:var(--blue);font-weight:600;text-align:left;align-self:flex-start}
.tapwrap{position:relative;border-radius:12px;overflow:hidden;background:#000;cursor:crosshair;touch-action:manipulation}
.tapwrap img{display:block;width:100%;max-height:52vh;object-fit:contain}
.tapdot{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border:3px solid var(--accent);border-radius:50%;pointer-events:none}
.choice{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;width:100%}
.thumbrow{display:flex;gap:10px;align-items:center}
.thumbrow img{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;flex:none}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.confirm{background:var(--sunken);border-radius:10px;padding:12px;margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.confirm p{margin:0;flex:1;min-width:160px}

/* detalle */
.hero-ph{aspect-ratio:4/3;max-width:100%;border-radius:14px;overflow:hidden;background:var(--sunken);display:grid;place-items:center;position:relative}
.hero-ph img{width:100%;height:100%;object-fit:cover}
.hero-ph svg{width:70%}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
.specs div{background:var(--surface);padding:9px 11px;min-width:0}
.specs dt{font-family:var(--f-label);text-transform:uppercase;font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:600}
.specs dd{margin:0;font-weight:600;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}

/* paneles */
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);min-width:0}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .v.pos{color:var(--ok)} .kpi .v.neg{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.bar{display:grid;grid-template-columns:minmax(70px,34%) 1fr 36px;gap:8px;align-items:center;font-size:14px}
.bar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{height:12px;background:var(--sunken);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:3px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cols{display:grid;gap:12px;margin-top:12px}
@media(min-width:720px){.cols{grid-template-columns:1fr 1fr}}
.list-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .nm{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.list-row input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
.yearchart{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.scanbox{display:grid;gap:10px}
.scanbig{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 12px;border:2px dashed var(--accent);border-radius:14px;background:var(--surface);font-weight:700;text-align:center}
.scanbig svg{width:46px;height:46px;color:var(--accent)}
.result{background:var(--surface);border-radius:12px;padding:12px;border-left:4px solid var(--accent)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;letter-spacing:.5px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<header class="top"><div class="wrap">
  <div class="brand">Garaje<b>64</b><small>1:64</small></div>
  <button class="mode" id="modeBtn" type="button"><i></i><span id="modeTxt">Este dispositivo</span></button>
  <button class="gear" id="gearBtn" type="button" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
</div></header>

<main class="wrap" id="app"></main>

<nav class="bottom" aria-label="Secciones"><div class="in">
  <button data-go="garaje" aria-current="page" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6v10H3z"/><path d="M7 20v-6h10v6"/></svg>Garaje</button>
  <button data-go="catalogo" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6a2 2 0 012 2v14a2 2 0 00-2-2H4zM20 4h-6a2 2 0 00-2 2v14a2 2 0 012-2h6z"/></svg>Catálogo</button>
  <button data-go="scan" class="scan" type="button"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7V5a1 1 0 011-1h2M17 4h2a1 1 0 011 1v2M20 17v2a1 1 0 01-1 1h-2M7 20H5a1 1 0 01-1-1v-2M7 9v6M10 9v6M13 9v6M16 9v6"/></svg></span>Escanear</button>
  <button data-go="stats" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Valor</button>
  <button data-go="listas" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1.4" fill="currentColor"/><circle cx="4" cy="12" r="1.4" fill="currentColor"/><circle cx="4" cy="18" r="1.4" fill="currentColor"/></svg>Listas</button>
</div></nav>

<div id="layer"></div>

<script>
"use strict";
/* ============ utilidades ============ */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Local: IndexedDB (con respaldo en memoria si el navegador lo bloquea)
function LocalStore(){
  let dbp = null, mem = null, listeners = [];
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res) => {
      try{
        const r = indexedDB.open("garaje64", 1);
        r.onupgradeneeded = () => { const d=r.result; d.createObjectStore("cars",{keyPath:"id"}); d.createObjectStore("meta"); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
        r.onblocked = () => res(null);
        setTimeout(()=>res(null), 4000);
      }catch(e){ res(null); }
    });
    dbp.then(d => { api.memoryOnly = !d; });
    return dbp;
  }
  async function tx(store, mode, fn){
    const d = await open();
    if(!d){ if(!mem) mem={cars:new Map(),meta:new Map()}; return fn(null, mem[store]); }
    return new Promise((res,rej)=>{ const t=d.transaction(store,mode); const s=t.objectStore(store); let out; const r=fn(s); if(r) r.onsuccess=()=>out=r.result; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); });
  }
  const notify = async () => { const cars = await api.all(); const meta = await api.getMeta(); listeners.forEach(f=>f(cars, meta)); };
  const api = {
    kind:"local", memoryOnly:false,
    async all(){ const r = await tx("cars","readonly",(s,m)=> m ? null : s.getAll()); return r || (mem ? [...mem.cars.values()] : []); },
    async put(car){ await tx("cars","readwrite",(s,m)=> m ? (m.set(car.id,car),null) : s.put(car)); notify(); },
    async putMany(cars){ for(const c of cars) await tx("cars","readwrite",(s,m)=> m ? (m.set(c.id,c),null) : s.put(c)); notify(); },
    async del(id){ await tx("cars","readwrite",(s,m)=> m ? (m.delete(id),null) : s.delete(id)); notify(); },
    async getMeta(){ const v = await tx("meta","readonly",(s,m)=> m ? null : s.get("meta")); return v || (mem && mem.meta.get("meta")) || null; },
    async setMeta(meta){ await tx("meta","readwrite",(s,m)=> m ? (m.set("meta",meta),null) : s.put(meta,"meta")); notify(); },
    subscribe(f){ listeners.push(f); notify(); return ()=>{ listeners = listeners.filter(x=>x!==f); }; },
    async init(){
      const first = !ls.get("g64.seeded", false);
      if(first){ ls.set("g64.seeded", true); const cur = await api.all(); if(!cur.length){ await api.putMany(sampleCars()); await api.setMeta({lists:["Vitrina principal","Para regalar","Colección JDM"]}); } }
    }
  };
  return api;
}

// Nube: base de datos del artifact. "cuenta" = colección privada de cada persona; "cloud" = colección compartida.
function CloudStore(db, carsPath, metaPath, kind){
  let carsCache = [], metaCache = null, listeners = [], unsubs = [];
  const emit = () => listeners.forEach(f=>f(carsCache, metaCache));
  const clean = car => JSON.parse(JSON.stringify(car));
  return {
    kind,
    async all(){ return carsCache; },
    async put(car){ await db.collection(carsPath).doc(car.id).set(clean(car)); },
    async putMany(cars){ for(const c of cars) await db.collection(carsPath).doc(c.id).set(clean(c)); },
    async del(id){ await db.collection(carsPath).doc(id).delete(); },
    async getMeta(){ return metaCache; },
    async fetchMeta(){ try{ const s = await db.doc(metaPath).get(); return s.exists ? s.data() : null; }catch(e){ return null; } },
    async setMeta(meta){ await db.doc(metaPath).set(meta); },
    subscribe(f){
      listeners.push(f);
      if(!unsubs.length){
        let loaded = false;
        const timer = setTimeout(()=>{ if(!loaded){ state.cloudNote = "No se puede conectar con tu cuenta todavía. Revisa tu conexión a internet."; state.cloudLoaded = true; render(); } }, 10000);
        unsubs.push(db.collection(carsPath).onSnapshot(s=>{ carsCache = s.docs.map(d=>d.data()); loaded = true; clearTimeout(timer); state.cloudNote=""; state.cloudLoaded = true; emit(); },
          e=>{ clearTimeout(timer); state.cloudNote = "No se pudo leer la colección: " + (e.message||e.code); state.cloudLoaded = true; render(); }));
        unsubs.push(db.doc(metaPath).onSnapshot(s=>{ metaCache = s.exists ? s.data() : null; emit(); }, ()=>{}));
      } else emit();
      return ()=>{ listeners = listeners.filter(x=>x!==f); if(!listeners.length){ unsubs.forEach(u=>{ try{u();}catch(e){} }); unsubs = []; } };
    },
    async init(){}
  };
}

let store = null, unsubStore = null, cloudDb = undefined;

async function getCloud(){
  if(cloudDb !== undefined) return cloudDb;
  try{ cloudDb = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){ cloudDb = null; }
  return cloudDb;
}
async function getUserId(){
  if(state.uid) return state.uid;
  try{
    const user = window.claude && window.claude.use ? await window.claude.use("user") : null;
    if(user){ const id = await user.id(); if(id) state.uid = id; }
  }catch(e){}
  return state.uid;
}
function makeStore(mode, db){
  if(mode === "cuenta") return CloudStore(db, `data/users/${state.uid}/garage/cars`, `data/users/${state.uid}/garage`, "cuenta");
  if(mode === "cloud") return CloudStore(db, "cars", "meta/main", "cloud");
  return LocalStore();
}
async function setMode(mode, quiet){
  const db = (mode === "local") ? null : await getCloud();
  if(mode === "cuenta" && !(db && await getUserId())){ if(!quiet) toast("Para guardar en tu cuenta, abre la app con tu sesión de claude.ai iniciada."); mode = "local"; }
  if(mode === "cloud" && !db){ if(!quiet) toast("La colección compartida necesita tu sesión de claude.ai iniciada."); mode = "local"; }
  if(unsubStore) unsubStore();
  state.cloudLoaded = mode === "local"; state.cloudNote = "";
  store = makeStore(mode, db);
  state.mode = mode;
  $("#modeBtn").classList.toggle("cloud", mode!=="local");
  $("#modeTxt").textContent = MODE_NAMES[mode];
  await store.init();
  state.booting = false;
  unsubStore = store.subscribe((cars, meta)=>{ state.cars = cars || []; state.lists = (meta && meta.lists) || []; render(); });
  if(mode === "local"){ await store.all(); render(); }
  checkLocalLeftovers();
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  let list = state.cars.filter(c=>{
    if(state.filter==="owned" && c.status==="wish") return false;
    if(state.filter==="wish" && c.status!=="wish") return false;
    if(state.filter==="dupes" && !(c.status!=="wish" && num(c.qty)>1)) return false;
    if(state.filter==="trade" && !c.trade) return false;
    if(state.filter==="th" && c.th!=="TH") return false;
    if(state.filter==="sth" && c.th!=="STH") return false;
    if(state.filter==="blister" && c.condition!=="blister") return false;
    if(state.listFilter && !(c.lists||[]).includes(state.listFilter)) return false;
    if(q){ const hay = [c.name,c.series,c.year,c.color,c.code,c.barcode,c.caseLetter&&("case "+c.caseLetter),c.location,c.store,c.notes,c.colNum].join(" ").toLowerCase(); if(!q.split(/\s+/).every(w=>hay.includes(w))) return false; }
    return true;
  });
  const by = {
    recent:(a,b)=>(b.created||0)-(a.created||0),
    name:(a,b)=>String(a.name).localeCompare(String(b.name),"es"),
    year:(a,b)=>num(b.year)-num(a.year) || String(a.name).localeCompare(String(b.name),"es"),
    value:(a,b)=>num(b.value)*num(b.qty||1)-num(a.value)*num(a.qty||1),
    case:(a,b)=>num(b.year)-num(a.year) || String(a.caseLetter||"Z").localeCompare(String(b.caseLetter||"Z"))
  };
  return list.sort(by[state.sort]||by.recent);
}

function cardHTML(c){
  const ph = c.photo ? `<img src="${esc(c.photo)}" alt="" loading="lazy">` : carSVG(colorOf(c.color));
  const l = [], r = [];
  if(c.th==="STH") l.push(`<span class="tag sth">STH</span>`); else if(c.th==="TH") l.push(`<span class="tag th">TH</span>`);
  if(c.status==="wish") l.push(`<span class="tag wish">Busco</span>`);
  if(c.example) l.push(`<span class="tag ex">Ejemplo</span>`);
  if(c.caseLetter) r.push(`<span class="tag">Case ${esc(c.caseLetter)}</span>`);
  if(num(c.qty)>1 && c.status!=="wish") r.push(`<span class="tag qty">×${num(c.qty)}</span>`);
  const sub = [c.year, c.series].filter(Boolean).join(" · ") || "Sin serie";
  return `<button class="card" type="button" data-open="${esc(c.id)}"><div class="ph">${ph}<div class="tags"><span class="l">${l.join("")}</span><span class="r">${r.join("")}</span></div></div><div class="meta"><span class="nm">${esc(c.name)}</span><span class="sub">${esc(sub)}</span></div></button>`;
}

function viewStats(){
  const o = owned();
  const units = o.reduce((s,c)=>s+num(c.qty||1),0);
  const paid = o.reduce((s,c)=>s+num(c.price)*num(c.qty||1),0);
  const val = o.reduce((s,c)=>s+num(c.value||c.price)*num(c.qty||1),0);
  const gain = val - paid;
  const th = o.filter(c=>c.th==="TH").length, sth = o.filter(c=>c.th==="STH").length;
  const dup = o.reduce((s,c)=>s+Math.max(0,num(c.qty||1)-1),0);
  const wishVal = wish().reduce((s,c)=>s+num(c.value),0);
  const group = (key) => { const m={}; o.forEach(c=>{ const k = String(c[key]||"").trim() || "—"; m[k]=(m[k]||0)+num(c.qty||1); }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const bars = (rows, max=8) => { const top = rows.slice(0,max); const mx = Math.max(1,...top.map(r=>r[1])); return top.length ? `<div class="bars">${top.map(([k,n])=>`<div class="bar"><span class="t" title="${esc(k)}">${esc(k)}</span><span class="track"><span class="fill" style="display:block;width:${(n/mx*100).toFixed(1)}%"></span></span><span class="n">${n}</span></div>`).join("")}</div>` : `<p class="muted">Sin datos.</p>`; };
  const topVal = [...o].sort((a,b)=>num(b.value)-num(a.value)).slice(0,5);
  // gráfico por año
  const years = group("year").filter(r=>r[0]!=="—").sort((a,b)=>num(a[0])-num(b[0]));
  let yc = `<p class="muted">Agrega el año a tus autos para ver la línea de tiempo.</p>`;
  if(years.length){
    const W=600,H=200,pl=30,pb=26,pt=12, mx=Math.max(...years.map(y=>y[1])); const bw=(W-pl-8)/years.length;
    const ticks=[0,Math.ceil(mx/2),mx].filter((v,i,a)=>a.indexOf(v)===i);
    yc = `<div style="overflow-x:auto"><svg class="yearchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Autos por año">
      ${ticks.map(t=>{const y=H-pb-(t/mx)*(H-pb-pt);return `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${t}</text>`;}).join("")}
      ${years.map(([yr,n],i)=>{const h=(n/mx)*(H-pb-pt);const x=pl+i*bw+bw*.15;return `<rect x="${x}" y="${H-pb-h}" width="${bw*.7}" height="${h}" rx="3" fill="var(--accent)"/><text x="${x+bw*.35}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(yr)}</text>`;}).join("")}
    </svg></div>`;
  }
  return `
  <div class="label">Tu colección en números</div><h1>Valor y estadísticas</h1>
  <div class="kpis">
    <div class="kpi"><div class="label">Autos</div><div class="v">${units}</div><div class="muted" style="font-size:13px">${o.length} modelos distintos</div></div>
    <div class="kpi"><div class="label">Invertido</div><div class="v">${money(paid)}</div></div>
    <div class="kpi"><div class="label">Valor estimado</div><div class="v">${money(val)}</div></div>
    <div class="kpi"><div class="label">Ganancia</div><div class="v ${gain>=0?"pos":"neg"}">${gain>=0?"+":"−"}${money(Math.abs(gain))}</div><div class="muted" style="font-size:13px">${paid?((gain/paid)*100).toFixed(0)+"% sobre lo pagado":"Agrega precios"}</div></div>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="label">Treasure Hunt</div><div class="v" style="color:var(--blue)">${th}</div></div>
    <div class="kpi"><div class="label">Super TH</div><div class="v" style="color:var(--gold)">${sth}</div></div>
    <div class="kpi"><div class="label">Repetidos</div><div class="v">${dup}</div><div class="muted" style="font-size:13px">copias extra para cambiar</div></div>
    <div class="kpi"><div class="label">Wishlist</div><div class="v">${wish().length}</div><div class="muted" style="font-size:13px">${wishVal?money(wishVal)+" estimado":"por conseguir"}</div></div>
  </div>
  <div class="panel" style="margin-top:12px"><h3>Autos por año</h3>${yc}</div>
  <div class="cols">
    <div class="panel"><h3>Series con más autos</h3>${bars(group("series"))}</div>
    <div class="panel"><h3>Por case</h3>${bars(group("caseLetter").map(([k,n])=>[k==="—"?"Sin case":"Case "+k,n]),17)}</div>
    <div class="panel"><h3>Más valiosos</h3>${topVal.length?`<div class="bars">${topVal.map(c=>`<div class="list-row" style="padding:6px 0"><button class="nm" style="background:none;border:0;padding:0;text-align:left;font-weight:600" data-open="${esc(c.id)}" type="button">${esc(c.name)}</button><span style="font-variant-numeric:tabular-nums;font-weight:700">${money(c.value)}</span></div>`).join("")}</div>`:`<p class="muted">Sin datos.</p>`}</div>
    <div class="panel"><h3>Estado</h3>${bars([["En blíster",o.filter(c=>c.condition==="blister").reduce((s,c)=>s+num(c.qty||1),0)],["Suelto",o.filter(c=>c.condition!=="blister").reduce((s,c)=>s+num(c.qty||1),0)]])}</div>
  </div>`;
}

const CODE_INDEX = {}; CATALOG.forEach((r,ri)=> (r[6]||[]).forEach((v,vi)=> CODE_INDEX[v[0]] = {r:ri, v:vi}));
const KNOWN_CODES = new Set(Object.keys(CODE_INDEX));
const cat = { year: "2026", fil: "all", series: "", q: "", limit: 80 };
const normName = s => String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
function catIndex(){
  const byNum = new Map(), byName = new Map();
  state.cars.forEach(c=>{
    const y = String(c.year||""); const n = parseInt(String(c.colNum||"").split("/")[0],10);
    if(n) byNum.set(y+"|"+n, c);
    byName.set(y+"|"+normName(c.name), c);
  });
  return r => byNum.get(r[0]+"|"+r[1]) || byName.get(r[0]+"|"+normName(r[2])) || null;
}
const pad3 = n => String(n).padStart(3,"0");
function viewCatalogo(){
  const find = catIndex();
  const years = [...new Set(CATALOG.map(r=>String(r[0])))];
  const inYear = CATALOG.filter(r => cat.year==="all" || String(r[0])===cat.year);
  const seriesAll = [...new Set(inYear.map(r=>r[3]))].sort((a,b)=>a.localeCompare(b,"es"));
  const q = cat.q.trim().toLowerCase();
  const rows = inYear.filter(r=>{
    if(cat.series && r[3]!==cat.series) return false;
    const c = find(r); const have = c && c.status!=="wish";
    if(cat.fil==="miss" && have) return false;
    if(cat.fil==="have" && !have) return false;
    if(cat.fil==="th" && r[5]!=="TH") return false;
    if(cat.fil==="sth" && r[5]!=="STH") return false;
    if(q && !(r[2]+" "+r[3]+" "+r[1]+" case "+r[4]+" "+(r[6]||[]).map(v=>v[0]).join(" ")).toLowerCase().includes(q)) return false;
    return true;
  });
  const scope = cat.series ? inYear.filter(r=>r[3]===cat.series) : inYear;
  const got = scope.filter(r=>{ const c=find(r); return c && c.status!=="wish"; }).length;
  const pct = scope.length ? Math.round(got/scope.length*100) : 0;
  const scopeName = (cat.series || "Línea principal") + " " + (cat.year==="all" ? years.join(" y ") : cat.year);
  const fils = [["all","Todos"],["miss","Me faltan"],["have","Los tengo"],["th","TH"],["sth","Super TH"]];
  const shown = rows.slice(0, cat.limit);
  const imgQ = r => "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent("Hot Wheels " + r[0] + " " + r[2] + " " + r[3]);
  return `
  <div class="label">Línea principal · ${CATALOG.length} modelos</div><h1>Catálogo</h1>
  <div class="panel" style="margin-top:12px">
    <div class="row" style="justify-content:space-between"><b>${esc(scopeName)}</b><span style="font-variant-numeric:tabular-nums;font-weight:700">${got} / ${scope.length}</span></div>
    <div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <div class="muted" style="font-size:13px;margin-top:4px">${pct}% completado${got<scope.length?` · te faltan ${scope.length-got}`:" · ¡serie completa!"}</div>
  </div>
  <div class="search">
    <input id="cq" type="search" placeholder="Buscar nombre, serie o toy # (ej. HYW43)…" value="${esc(cat.q)}" aria-label="Buscar en el catálogo">
    <select id="cseries" aria-label="Serie"><option value="">Todas las series</option>${seriesAll.map(s=>`<option ${cat.series===s?"selected":""}>${esc(s)}</option>`).join("")}</select>
  </div>
  <div class="chips" role="group" aria-label="Año">${[["all","Todos los años"],...years.map(y=>[y,y])].map(([v,t])=>`<button class="chip" type="button" data-cyear="${v}" aria-pressed="${cat.year===v}">${t}</button>`).join("")}</div>
  <div class="chips" style="margin-top:6px" role="group" aria-label="Filtro">${fils.map(([v,t])=>`<button class="chip" type="button" data-cfil="${v}" aria-pressed="${cat.fil===v}">${t}</button>`).join("")}</div>
  ${rows.length ? `<div class="cat">${shown.map((r,i)=>{
    const c = find(r); const have = c && c.status!=="wish"; const want = c && c.status==="wish";
    const idx = CATALOG.indexOf(r);
    const badges = (r[5]==="STH"?`<span class="tag sth">STH</span> `:r[5]==="TH"?`<span class="tag th">TH</span> `:"");
    return `<div class="crow ${have?"have":""}"><div class="no">${pad3(r[1])}<small>${r[0]}</small></div>
      <div class="tx"><b>${badges}${esc(r[2])}</b><span>${esc(r[3])}${r[4]?" · Case "+esc(r[4]):""}</span>${(r[6]||[]).length?`<span class="codes">${r[6].map(v=>esc(v[0])).join(" · ")}</span>`:""}<a href="${imgQ(r)}" target="_blank" rel="noopener">Ver fotos</a></div>
      <div class="act">${have ? `<button class="have-pill" type="button" data-open="${esc(c.id)}">✓ Tengo${num(c.qty)>1?" ×"+num(c.qty):""}</button>` : want ? `<button class="want-pill" type="button" data-open="${esc(c.id)}">En wishlist</button><button class="btn sm primary" type="button" data-cadd="${idx}">Lo tengo</button>` : `<button class="btn sm primary" type="button" data-cadd="${idx}">Lo tengo</button><button class="btn sm" type="button" data-cwish="${idx}">Lo busco</button>`}</div></div>`;
  }).join("")}</div>
  ${rows.length>cat.limit?`<div style="text-align:center;margin-top:12px"><button class="btn" type="button" data-cmore>Mostrar más (${rows.length-cat.limit} restantes)</button></div>`:""}`
  : `<div class="empty"><h2>Sin resultados</h2><p>Ningún modelo del catálogo coincide.</p></div>`}
  <p class="muted" style="font-size:12px;margin-top:14px">Datos de la línea principal tomados de listas públicas de coleccionistas; pueden tener errores. Las fotos se abren en internet porque son propiedad de su fabricante.</p>`;
}
function carFromCatalog(r, status, variant){
  let c = null;
  if(variant) c = state.cars.find(x => String(x.code||"").toUpperCase() === variant[0]) || null;
  if(!c){ const m = (catIndex())(r); if(m && (!variant || !m.code || String(m.code).toUpperCase()===variant[0])) c = m; }
  const base = { name:r[2], series:r[3], year:r[0], colNum: pad3(r[1])+"/250", caseLetter:r[4]||"", th:r[5]||"", status };
  if(variant){ base.code = variant[0]; base.th = variant[2]||""; if(!c || !c.color) base.color = colorEs(variant[1]); }
  return c ? Object.assign({}, c, base) : base;
}
const COLOR_ES = {red:"Rojo",blue:"Azul",black:"Negro",white:"Blanco",green:"Verde",yellow:"Amarillo",orange:"Naranja",gray:"Gris",grey:"Gris",silver:"Plata",purple:"Morado",pink:"Rosado",gold:"Dorado",teal:"Turquesa",turquoise:"Turquesa",brown:"Café",maroon:"Granate",burgundy:"Granate",cream:"Crema",tan:"Arena",sand:"Arena",aqua:"Aguamarina",lime:"Lima",bronze:"Bronce",copper:"Cobre",olive:"Oliva",lavender:"Lavanda",lavendar:"Lavanda",mauve:"Malva",chrome:"Cromado",zamac:"ZAMAC",light:"claro",dark:"oscuro",steel:"acero",army:"militar",military:"militar",baby:"bebé",burnt:"quemado",flat:"mate",matte:"mate",deep:"profundo",pale:"pálido",slate:"pizarra",gunmetal:"grafito",rose:"rosa",champagne:"champán",smoke:"humo",mustard:"mostaza",metallic:"metálico",off:"hueso"};
function colorEs(en){
  const w = String(en||"").split(/\s+/).filter(Boolean); if(!w.length) return "";
  const fin = w.filter(x=>!/^(spectraflame|metalflake)$/i.test(x));
  const main = fin.map(x=>COLOR_ES[x.toLowerCase()]||x);
  const finish = w.find(x=>/^(spectraflame|metalflake)$/i.test(x));
  const mods = main.filter((x,i)=>/^(claro|oscuro|acero|militar|bebé|quemado|mate|profundo|pálido|pizarra|metálico|hueso)$/.test(x));
  const cols = main.filter(x=>!mods.includes(x));
  return [cols.join(" "), mods.join(" "), finish||""].filter(Boolean).join(" ");
}

function bindView(){
  const app = $("#app");
  const q = $("#q");
  if(q){ q.oninput = e => { state.q = e.target.value; const pos = e.target.selectionStart; render(); const n=$("#q"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} }; }
  const so = $("#sort"); if(so) so.onchange = e => { state.sort = e.target.value; render(); };
  const cq = $("#cq"); if(cq) cq.oninput = e => { cat.q = e.target.value; cat.limit = 80; const pos = e.target.selectionStart; render(); const n=$("#cq"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} };
  const cs = $("#cseries"); if(cs) cs.onchange = e => { cat.series = e.target.value; cat.limit = 80; render(); };
  const cur = $("#cur"); if(cur) cur.onchange = e => { state.currency = e.target.value; ls.set("g64.currency", state.currency); toast("Moneda actualizada"); };
  const imp = $("#importFile"); if(imp) imp.onchange = e => importJson(e.target.files[0]);
  const nl = $("#newList"); if(nl) nl.onsubmit = async e => { e.preventDefault(); const v=$("#newListName").value.trim(); if(!v) return; if(state.lists.includes(v)) return toast("Esa lista ya existe"); await store.setMeta({lists:[...state.lists, v]}); toast("Lista creada"); };
  app.onclick = async e => {
    const t = e.target.closest("button"); if(!t) return;
    if(t.dataset.open) return openDetail(t.dataset.open);
    if(t.dataset.cyear){ cat.year = t.dataset.cyear; cat.series = ""; cat.limit = 80; return render(); }
    if(t.dataset.cfil){ cat.fil = t.dataset.cfil; cat.limit = 80; return render(); }
    if(t.dataset.cmore!==undefined){ cat.limit += 120; return render(); }
    if(t.dataset.cadd) return openForm(Object.assign(carFromCatalog(CATALOG[+t.dataset.cadd], "owned"), {qty:1, date:new Date().toISOString().slice(0,10)}), "Agregar a mi garaje");
    if(t.dataset.cwish){ const r = CATALOG[+t.dataset.cwish]; const base = carFromCatalog(r, "wish"); await store.put(Object.assign({id:uid(), created:Date.now(), qty:1, condition:"blister", quality:"Mint", lists:[], trade:false, photo:"", notes:"", example:false}, base)); toast("Agregado a tu wishlist"); return; }
    if(t.dataset.filter){ state.filter = t.dataset.filter; return render(); }
    if(t.dataset.list!==undefined){ state.listFilter = t.dataset.list; return render(); }
    if(t.dataset.mode){ ls.set("g64.mode2", t.dataset.mode); await setMode(t.dataset.mode); return; }
    if(t.dataset.showlist){ state.listFilter = state.lists[+t.dataset.showlist]; state.filter="all"; state.q=""; return go("garaje"); }
    if(t.dataset.showloc){ state.q = t.dataset.showloc; state.listFilter=""; state.filter="all"; return go("garaje"); }
    if(t.dataset.renlist) return renameList(+t.dataset.renlist);
    if(t.dataset.dellist) return deleteList(+t.dataset.dellist);
    const a = t.dataset.act;
    if(a==="new") return openForm();
    if(a==="scan") return openScan();
    if(a==="clearEx"){ for(const c of state.cars.filter(c=>c.example)) await store.del(c.id); return toast("Ejemplos borrados"); }
    if(a==="exportJson") return exportJson();
    if(a==="exportCsv") return exportCsv();
    if(a==="copyTo") return copyLocalTo(t.dataset.target);
    if(a==="howInstall") return openInstall();
    if(a==="migrate") return copyLocalTo("cuenta");
    if(a==="toCuenta") return copyLocalTo("cuenta");
    if(a==="askWipe"){ $("#wipeBox").innerHTML = `<div class="confirm"><p>Se borrarán ${state.cars.length} autos. No se puede deshacer.</p><button class="btn sm" type="button" data-act="noWipe">Cancelar</button><button class="btn sm danger" type="button" data-act="wipe">Borrar todo</button></div>`; return; }
    if(a==="noWipe"){ $("#wipeBox").innerHTML=""; return; }
    if(a==="wipe"){ for(const c of [...state.cars]) await store.del(c.id); toast("Colección borrada"); return; }
  };
}
function renameList(i){
  const row = document.querySelector(`[data-li="${i}"]`); const old = state.lists[i];
  row.innerHTML = `<input value="${esc(old)}" maxlength="60" id="ren${i}" aria-label="Nuevo nombre"><button class="btn sm dark" type="button" id="renOk">Guardar</button>`;
  const inp = $("#ren"+i); inp.focus();
  $("#renOk").onclick = async () => {
    const v = inp.value.trim(); if(!v || v===old) return render();
    const lists = state.lists.map(l=>l===old?v:l);
    for(const c of state.cars.filter(c=>(c.lists||[]).includes(old))) await store.put(Object.assign({},c,{lists:c.lists.map(l=>l===old?v:l)}));
    await store.setMeta({lists}); if(state.listFilter===old) state.listFilter=v; toast("Lista renombrada");
  };
}
function deleteList(i){
  const row = document.querySelector(`[data-li="${i}"]`); const name = state.lists[i];
  row.innerHTML = `<span class="nm">¿Eliminar "${esc(name)}"? Los autos se quedan en tu garaje.</span><button class="btn sm" type="button" id="dlNo">No</button><button class="btn sm danger" type="button" id="dlYes">Eliminar</button>`;
  $("#dlNo").onclick = render;
  $("#dlYes").onclick = async () => {
    for(const c of state.cars.filter(c=>(c.lists||[]).includes(name))) await store.put(Object.assign({},c,{lists:c.lists.filter(l=>l!==name)}));
    await store.setMeta({lists: state.lists.filter(l=>l!==name)}); if(state.listFilter===name) state.listFilter=""; toast("Lista eliminada");
  };
}

  const layer = $("#layer");
  layer.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;

/* ============ fotos ============ */
function compress(file, max=560, q=.72){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const s = Math.min(1, max/Math.max(img.width,img.height)); const cv=document.createElement("canvas"); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg",q)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("imagen")); };
    img.src = url;
  });
}

/* ============ escáner de código de barras ============ */
let zxingP = null;
function loadZXing(){
  if(window.ZXing) return Promise.resolve(window.ZXing);
  if(!zxingP) zxingP = new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"; s.onload=()=>res(window.ZXing); s.onerror=()=>{ zxingP=null; rej(new Error("zxing")); }; document.head.appendChild(s); });
  return zxingP;
}
async function decodeBarcode(file){
  if("BarcodeDetector" in window){
    try{ const det = new BarcodeDetector({formats:["upc_a","upc_e","ean_13","ean_8","code_128","qr_code"]}); const bmp = await createImageBitmap(file); const r = await det.detect(bmp); if(r && r[0]) return r[0].rawValue; }catch(e){}
  }
  const ZX = await loadZXing();
  const url = URL.createObjectURL(file);
  try{
    const hints = new Map(); hints.set(ZX.DecodeHintType.TRY_HARDER, true);
    const reader = new ZX.BrowserMultiFormatReader(hints);
    const r = await reader.decodeFromImageUrl(url); return r.getText();
  }finally{ URL.revokeObjectURL(url); }
}
/* ============ lectura del toy # (OCR en el teléfono) ============ */
// Lectura del toy # en una foto del blíster: detección de renglones + relectura por franja
const G64OCR = (() => {
  const WL = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-";
  let workerP = null;
  function getWorker(base){
    if(!workerP){
      workerP = Tesseract.createWorker("eng", 1, {workerPath:base+"worker-wrap.js", corePath:base, langPath:base, gzip:true, workerBlobURL:false, cacheMethod:"none"});
      workerP.catch(()=>{ workerP = null; });
    }
    return workerP;
  }
  function toCanvas(img, maxSide, raw){
    const w0 = img.naturalWidth||img.width, h0 = img.naturalHeight||img.height;
    const s = Math.min(1, maxSide/Math.max(w0,h0));
    const W = Math.round(w0*s), H = Math.round(h0*s);
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const x = c.getContext("2d", {willReadFrequently:true}); x.drawImage(img,0,0,W,H);
    if(raw){ const d = x.getImageData(0,0,W,H), a = d.data; for(let i=0;i<a.length;i+=4){ const g=.299*a[i]+.587*a[i+1]+.114*a[i+2]; a[i]=a[i+1]=a[i+2]=g; } x.putImageData(d,0,0); return c; }
    // fondo difuminado para quitar sombras y brillos (normaliza la iluminación)
    const sw = Math.max(8, Math.round(W/24)), sh = Math.max(8, Math.round(H/24));
    const sm = document.createElement("canvas"); sm.width = sw; sm.height = sh;
    const sx = sm.getContext("2d"); sx.imageSmoothingEnabled = true; sx.drawImage(c,0,0,sw,sh);
    const bg = document.createElement("canvas"); bg.width = W; bg.height = H;
    const bx = bg.getContext("2d", {willReadFrequently:true}); bx.imageSmoothingEnabled = true; bx.imageSmoothingQuality = "high"; bx.drawImage(sm,0,0,W,H);
    const d = x.getImageData(0,0,W,H), a = d.data, b = bx.getImageData(0,0,W,H).data;
    for(let i=0;i<a.length;i+=4){
      const g = .299*a[i]+.587*a[i+1]+.114*a[i+2];
      const k = .299*b[i]+.587*b[i+1]+.114*b[i+2] + 1;
      let v = Math.min(255, g/k*235);
      v = v < 150 ? Math.max(0, (v-60)*1.6) : 255;
      a[i]=a[i+1]=a[i+2]=v;
    }
    x.putImageData(d,0,0); return c;
  }
  function crop(src, x0,y0,x1,y1, targetH){
    x0=Math.max(0,Math.floor(x0)); y0=Math.max(0,Math.floor(y0)); x1=Math.min(src.width,Math.ceil(x1)); y1=Math.min(src.height,Math.ceil(y1));
    const s = targetH ? Math.min(3, Math.max(1, targetH/(y1-y0))) : 1;
    const c = document.createElement("canvas"); c.width = Math.max(1,Math.round((x1-x0)*s)); c.height = Math.max(1,Math.round((y1-y0)*s));
    c.getContext("2d").drawImage(src, x0,y0,x1-x0,y1-y0, 0,0,c.width,c.height); return c;
  }
  function words(data){ const out=[]; (data.blocks||[]).forEach(b=>b.paragraphs.forEach(p=>p.lines.forEach(l=>{ out.push({line:true,bbox:l.bbox,text:l.text}); l.words.forEach(w=>out.push({bbox:w.bbox,text:w.text})); }))); return out; }
  async function readText(img, opts={}){
    const w = await getWorker(opts.base);
    const can = toCanvas(img, 1800);
    const rawc = toCanvas(img, 1800, true);
    const texts = [];
    await w.setParameters({tessedit_pageseg_mode:"11", tessedit_char_whitelist:""});
    const r = await w.recognize(can, {}, {blocks:true, text:true});
    texts.push(r.data.text);
    if(opts.stop && opts.stop(texts.join("\n"))) return texts.join("\n");
    // franjas horizontales alrededor de cada palabra detectada
    const H = can.height; let bands = [];
    words(r.data).forEach(o => { const h = o.bbox.y1-o.bbox.y0; if(h > H*0.012 && h < H*0.09) bands.push([o.bbox.y0-h*0.45, o.bbox.y1+h*0.45, o.bbox.x0, o.bbox.x1, h]); });
    bands.sort((a,b)=>a[0]-b[0]);
    const merged = [];
    for(const b of bands){ const m = merged[merged.length-1]; if(m && b[0] < m[1]-(m[1]-m[0])*0.4 && Math.abs(b[4]-m[4]) < m[4]*0.6){ m[1]=Math.max(m[1],b[1]); m[2]=Math.min(m[2],b[2]); m[3]=Math.max(m[3],b[3]); } else merged.push(b.slice()); }
    await w.setParameters({tessedit_pageseg_mode:"7", tessedit_char_whitelist:WL});
    for(const b of merged.slice(0,30)){
      const h = b[1]-b[0];
      const rr = await w.recognize(crop(rawc, 0, b[0], can.width, b[1], 64));
      texts.push(rr.data.text);
      if(opts.stop && opts.stop(texts.join("\n"))) break;
    }
    return texts.join("\n");
  }
  // relectura alrededor de un punto que el usuario toca en la foto (coordenadas 0..1)
  async function readAt(img, fx, fy, opts={}){
    const w = await getWorker(opts.base);
    const raw = toCanvas(img, 2000, true);
    const H = raw.height, W = raw.width, out = [];
    await w.setParameters({tessedit_pageseg_mode:"7", tessedit_char_whitelist:WL});
    for(const [hh, ww, dy] of [[0.07,0.5,0],[0.1,0.7,0],[0.05,0.4,0],[0.07,0.6,-0.03],[0.07,0.6,0.03]]){
      const cy = fy + dy;
      const r = await w.recognize(crop(raw, fx*W-ww*W/2, cy*H-hh*H/2, fx*W+ww*W/2, cy*H+hh*H/2, 72));
      out.push(r.data.text); if(opts.stop && opts.stop(out.join("\n"))) break;
    }
    return out.join("\n");
  }
  const L2 = {"0":"O","1":"I","2":"Z","4":"A","5":"S","6":"G","8":"B","7":"T"};
  const D2 = {"O":"0","Q":"0","D":"0","U":"0","I":"1","L":"1","T":"7","Z":"2","S":"5","B":"8","G":"6","A":"4"};
  const CONF = new Set(["O0","Q0","D0","U0","I1","L1","Z2","S5","B8","G6","A4","T7","VW","VY","UV","MN","HN","CG","EF","PR","KX","OQ","OD","HM","WN","IJ","AH","HA"].flatMap(p=>[p,p[1]+p[0]]));
  const subCost = (x,y) => x===y ? 0 : (CONF.has(x+y) ? 0.3 : 1);
  function dist(s, t){ // Levenshtein con costo menor para letras que la cámara confunde
    const m=s.length, n=t.length; let prev=new Array(n+1).fill(0).map((_,j)=>j), cur=new Array(n+1);
    for(let i=1;i<=m;i++){ cur[0]=i; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+subCost(s[i-1],t[j-1])); [prev,cur]=[cur,prev]; }
    return prev[n];
  }
  function findCodes(text, known){
    const cand = new Map();
    const add = (code, score) => { if(!cand.has(code) || cand.get(code) < score) cand.set(code, score); };
    const lines = String(text||"").toUpperCase().replace(/[‐-―−~_]/g,"-").split(/\n+/);
    for(const line of lines){
      const c = line.replace(/[^A-Z0-9\-]/g,"");
      // 1) coincidencia exacta (corrigiendo letras/dígitos por posición)
      for(let i=0;i+5<=c.length;i++){
        const w = c.slice(i,i+5); if(w.includes("-")) continue;
        const f = w.slice(0,3).split("").map(ch=>L2[ch]||ch).join("") + w.slice(3).split("").map(ch=>D2[ch]||ch).join("");
        if(known.has(f)) add(f, 20 + (c[i+5]==="-"?3:0) + (w===f?1:0));
      }
      // 2) lo que va justo antes del guion (formato HYW43-N7C5), con tolerancia
      for(let i=c.indexOf("-"); i>=4; i=c.indexOf("-", i+1)){
        if(!/^[A-Z0-9]{3}/.test(c.slice(i+1))) continue;
        const scored = [];
        for(let len=4; len<=6 && len<=i; len++){
          const sub = c.slice(i-len, i);
          for(const k of known){ const d = dist(sub, k) + (len===5?0:0.15); if(d <= 1.3) scored.push({k, d}); }
        }
        const byK = new Map(); scored.forEach(o => { if(!byK.has(o.k) || byK.get(o.k) > o.d) byK.set(o.k, o.d); });
        const list = [...byK.entries()].map(([k,d])=>({k,d})).sort((a,b)=>a.d-b.d);
        if(!list.length) continue;
        const best = list[0], second = list[1];
        if(!second || second.d - best.d >= 0.4) add(best.k, best.d <= 0.65 ? 19 : 12 - best.d);
        else list.filter(o => o.d <= best.d + 0.4).slice(0,3).forEach(o => add(o.k, 11 - o.d));
      }
    }
    return [...cand.entries()].sort((a,b)=>b[1]-a[1]).map(([code,score])=>({code, sure: score>=19}));
  }
  return { readText, readAt, findCodes, preload: base => getWorker(base) };
})();

let tessP = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(!tessP) tessP = new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="ocr/tesseract.min.js"; s.onload=res; s.onerror=()=>{ tessP=null; rej(new Error("ocr")); }; document.head.appendChild(s); });
  return tessP;
}
const ocrBase = () => new URL("ocr/", document.baseURI).href;
function warmOCR(){ loadTesseract().then(()=>G64OCR.preload(ocrBase())).catch(()=>{}); }
// nombres del catálogo que aparecen en el texto leído (el nombre va impreso en grande atrás del blíster)
function namesInText(text){
  const t = normName(text);
  const hits = [];
  CATALOG.forEach((r,ri)=>{ const n = normName(r[2]).replace(/^\d{2}/,""); if(n.length>=6 && t.includes(n)) hits.push(ri); });
  return hits;
}
function variantLabel(r, v){ return `${r[0]} · #${pad3(r[1])} · ${esc(colorEs(v[1]))}`; }

function openScan(){
  warmOCR();
  const L = sheet(`
    <div class="sheet-h"><h2>Escanear blíster</h2><button class="x" data-close type="button" aria-label="Cerrar">✕</button></div>
    <div class="scanbox" id="scanBox">
      <label class="scanbig filebtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7V5a1 1 0 011-1h2M17 4h2a1 1 0 011 1v2M20 17v2a1 1 0 01-1 1h-2M7 20H5a1 1 0 01-1-1v-2M7 9v6M10 9v6M13 9v6M16 9v6"/></svg>Tomar foto del código<span class="muted" style="font-weight:500;font-size:13px">Enfoca el código junto al gancho del blíster, por ejemplo <span class="code">HYW43-N7C5</span>. El código de barras también sirve.</span><input type="file" accept="image/*" capture="environment" id="sc1"></label>
      <label class="btn filebtn">Usar una foto de la galería<input type="file" accept="image/*" id="sc2"></label>
      <div class="row"><input id="manual" autocapitalize="characters" autocomplete="off" placeholder="O escribe el código: HYW43 o el de barras" style="flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px" aria-label="Código manual"><button class="btn dark" type="button" id="mGo">Buscar</button></div>
      <div id="scanOut"></div>
    </div>`);
  const out = $("#scanOut",L);
  let pendingBarcode = "";
  const status = (msg, img) => { out.innerHTML = `<div class="result thumbrow">${img?`<img src="${img}" alt="">`:""}<div class="row" style="flex:1"><span class="spin" aria-hidden="true"></span><span>${msg}</span></div></div>`; };
  const fail = (msg) => `<div class="result"><b>${msg}</b><p class="muted" style="margin:4px 0 0">Escribe el código del blíster en la casilla de arriba (las 5 primeras letras y números, por ejemplo HYW43).</p></div>`;

  // resultado final para un toy # del catálogo
  function resolveCode(code){
    const ix = CODE_INDEX[code]; if(!ix) return showMatch(code);
    const r = CATALOG[ix.r], v = r[6][ix.v];
    const base = carFromCatalog(r, "owned", v);
    if(pendingBarcode && !base.barcode) base.barcode = pendingBarcode;
    const existing = base.id ? state.cars.find(x=>x.id===base.id) : null;
    if(existing && existing.status!=="wish"){
      out.innerHTML = `<div class="result"><div class="label">Código ${esc(code)}</div><p style="margin:6px 0"><b>Ya lo tienes:</b> ${esc(existing.name)} ${esc(existing.color?"("+existing.color+")":"")} ×${num(existing.qty||1)}</p><div class="row"><button class="btn" type="button" data-open2="${esc(existing.id)}">Ver ficha</button><button class="btn primary" type="button" data-plus="${esc(existing.id)}">Sumar una copia</button></div></div>`;
      out.onclick = async e => { const b=e.target.closest("button"); if(!b) return;
        if(b.dataset.open2) openDetail(b.dataset.open2);
        if(b.dataset.plus){ const c = state.cars.find(x=>x.id===b.dataset.plus); await store.put(Object.assign({},c,{qty:num(c.qty||1)+1}, (!c.code?{code}:{}), (pendingBarcode&&!c.barcode?{barcode:pendingBarcode}:{}))); closeSheet(); toast("Ahora tienes "+(num(c.qty||1)+1)+" de "+c.name); } };
      return;
    }
    const today = new Date().toISOString().slice(0,10);
    const car = Object.assign(base, {status:"owned"}, existing ? {qty:1, date:today} : {qty:1, date:today, condition:"blister", quality:"Mint"});
    if(existing) toast("¡Estaba en tu wishlist!");
    openForm(car, existing ? "¡Lo encontraste!" : "Agregar a mi garaje", {quick:true, again:true});
  }

  // varias posibilidades: el usuario elige
  function showChoices(list, title){
    out.innerHTML = `<div class="result"><b>${title}</b><div class="stack" style="gap:6px;margin-top:8px">${list.map(([code])=>{ const ix=CODE_INDEX[code], r=CATALOG[ix.r], v=r[6][ix.v];
      return `<button class="btn choice" type="button" data-code="${esc(code)}"><span><b>${esc(r[2])}</b><br><span class="muted" style="font-size:13px">${variantLabel(r,v)} · <span class="code">${esc(code)}</span></span></span>${v[2]?`<span class="tag ${v[2]==="STH"?"sth":"th"}">${v[2]}</span>`:""}</button>`; }).join("")}
      <button class="btn" type="button" data-none>Ninguno de estos</button></div></div>`;
    out.onclick = e => { const b=e.target.closest("button"); if(!b) return; if(b.dataset.code) resolveCode(b.dataset.code); if(b.dataset.none!==undefined) out.innerHTML = fail("Escribe el código a mano."); };
  }

  function decide(text){
    const codes = G64OCR.findCodes(text, KNOWN_CODES);
    if(codes.length && codes[0].sure){ resolveCode(codes[0].code); return true; }
    const names = namesInText(text);
    let opts = codes.map(c=>c.code);
    if(names.length){ // prioriza los que coinciden con el nombre impreso
      const byName = opts.filter(c=>names.includes(CODE_INDEX[c].r));
      if(byName.length===1){ resolveCode(byName[0]); return true; }
      if(!opts.length) names.forEach(ri=> (CATALOG[ri][6]||[]).forEach(v=>opts.push(v[0])));
      else if(byName.length) opts = byName;
    }
    opts = [...new Set(opts)].slice(0,8);
    if(opts.length===1 && names.length){ resolveCode(opts[0]); return true; }
    if(opts.length){ showChoices(opts.map(c=>[c]), names.length && !codes.length ? "Leí el nombre del auto. ¿Cuál es el tuyo?" : "No se leyó del todo claro. ¿Cuál es?"); return true; }
    return false;
  }

  function tapMode(url, img){
    out.innerHTML = `<div class="result"><b>No encontré el código automáticamente.</b><p style="margin:4px 0 8px">Toca el código en la foto (por ejemplo <span class="code">HYW43-N7C5</span>).</p><div class="tapwrap" id="tapw"><img src="${url}" alt="Foto del blíster" id="tapimg"></div><p class="muted" id="tapmsg" style="margin:8px 0 0"></p></div>`;
    const im = $("#tapimg", out), w = $("#tapw", out);

      const rc = im.getBoundingClientRect();
      // la imagen usa object-fit: contain; calcula el área real dibujada
      const iw = img.naturalWidth, ih = img.naturalHeight, s = Math.min(rc.width/iw, rc.height/ih);
      const dw = iw*s, dh = ih*s, ox = (rc.width-dw)/2, oy = (rc.height-dh)/2;
      const fx = (e.clientX-rc.left-ox)/dw, fy = (e.clientY-rc.top-oy)/dh;
      if(fx<0||fx>1||fy<0||fy>1) return;
      w.querySelectorAll(".tapdot").forEach(d=>d.remove());
      const dot = document.createElement("span"); dot.className="tapdot"; dot.style.left=(e.clientX-rc.left)+"px"; dot.style.top=(e.clientY-rc.top)+"px"; w.appendChild(dot);
      $("#tapmsg", out).innerHTML = `<span class="row"><span class="spin"></span>Leyendo esa parte…</span>`;
      try{
        const t = await G64OCR.readAt(img, fx, fy, {base: ocrBase(), stop: s => G64OCR.findCodes(s, KNOWN_CODES).some(c=>c.sure)});
        if(!decide(t)) $("#tapmsg", out).textContent = "Tampoco pude leerlo ahí. Prueba tocando justo encima de las letras, o escríbelo arriba.";
      }catch(err){ $("#tapmsg", out).textContent = "La lectura automática no está disponible en este navegador. Escribe el código arriba."; }
    };
  }

  const handle = async f => {
    if(!f) return;
    pendingBarcode = "";
    const url = URL.createObjectURL(f);
    const img = new Image(); img.src = url;
    try{ await img.decode(); }catch(e){ out.innerHTML = fail("No se pudo abrir la foto."); return; }
    status("Buscando el código…", url);
    // 1) código de barras (si la foto lo muestra)
    try{
      const bc = await Promise.race([decodeBarcode(f), new Promise((_,rej)=>setTimeout(()=>rej(new Error("t")), 4000))]);
      if(bc){
        const d = String(bc).replace(/\D/g,"");
        const linked = state.cars.some(c => c.barcode && c.barcode.replace(/\D/g,"")===d);
        if(linked || !d) return showMatch(bc);
        pendingBarcode = bc;
      }
    }catch(e){}
    // 2) toy # impreso en el blíster
    status("Leyendo el código del blíster… la primera vez puede tardar unos segundos.", url);
    try{
      await loadTesseract();
      const text = await G64OCR.readText(img, {base: ocrBase(), stop: s => G64OCR.findCodes(s, KNOWN_CODES).some(c=>c.sure)});
      if(!decide(text)){
        if(pendingBarcode) return showMatch(pendingBarcode);
        tapMode(url, img);
      }
    }catch(e){
      if(pendingBarcode) return showMatch(pendingBarcode);
      out.innerHTML = fail("La lectura automática no está disponible en este navegador.");
    }
  };
  $("#sc1",L).onchange = e => handle(e.target.files[0]);
  $("#sc2",L).onchange = e => handle(e.target.files[0]);
  const mgo = () => {
    const v = $("#manual",L).value.trim().toUpperCase(); if(!v) return;
    const m = v.replace(/\s/g,"").match(/^([A-Z]{3}\d{2})/);
    if(m && CODE_INDEX[m[1]]) return resolveCode(m[1]);

  };
  $("#mGo",L).onclick = mgo; $("#manual",L).onkeydown = e => { if(e.key==="Enter") mgo(); };
  function showMatch(code){
    const k = code.trim().toUpperCase();
    const hits = state.cars.filter(c => (c.barcode && c.barcode.replace(/\D/g,"")===k.replace(/\D/g,"") && k.replace(/\D/g,"").length>5) || (c.code && c.code.toUpperCase()===k));
    const own = hits.filter(c=>c.status!=="wish"), wl = hits.filter(c=>c.status==="wish");
    const isUPC = /^\d{6,14}$/.test(k);
    let html = `<div class="result"><div class="label">Código leído</div><div class="code" style="font-size:20px">${esc(code)}</div>`;
    if(wl.length) html += `<p style="margin:8px 0 4px"><b>¡Está en tu wishlist!</b> ${esc(wl[0].name)}</p><button class="btn primary block" type="button" data-found="${esc(wl[0].id)}">¡Lo encontré! Pasar a mi garaje</button>`;
    else if(own.length) html += `<p style="margin:8px 0 4px"><b>Ya lo tienes:</b> ${esc(own[0].name)} (×${num(own[0].qty||1)})</p><div class="row"><button class="btn" type="button" data-open2="${esc(own[0].id)}">Ver ficha</button><button class="btn primary" type="button" data-plus="${esc(own[0].id)}">Sumar una copia</button></div>`;
    else html += `<p style="margin:8px 0 8px">Código nuevo. Búscalo en el catálogo y quedará vinculado a este código para la próxima vez.</p>
      <input id="scCat" type="search" placeholder="Nombre del auto (ej. Supra, Civic, Bronco)" style="width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px" aria-label="Buscar en el catálogo">
      <div id="scHits" class="stack" style="gap:6px;margin-top:8px"></div>
      <div class="row" style="margin-top:8px"><button class="btn" type="button" data-add="own">No está: agregar a mano</button><button class="btn" type="button" data-add="wish">Agregar a wishlist</button></div>`;
    out.innerHTML = html + `</div>`;
    const sc = $("#scCat", out);
    if(sc){
      const draw = () => {
        const q = sc.value.trim().toLowerCase();
        const hits = q.length < 2 ? [] : CATALOG.map((r,i)=>[r,i]).filter(([r])=>(r[2]+" "+r[3]).toLowerCase().includes(q)).slice(0,8);
        $("#scHits", out).innerHTML = hits.map(([r,i])=>`<button class="btn" style="justify-content:space-between;text-align:left" type="button" data-pick="${i}"><span><b>${esc(r[2])}</b><br><span class="muted" style="font-size:13px">${r[0]} · #${pad3(r[1])} · ${esc(r[3])}${r[4]?" · Case "+esc(r[4]):""}</span></span>${r[5]?`<span class="tag ${r[5]==="STH"?"sth":"th"}">${r[5]}</span>`:""}</button>`).join("") || (q.length>=2 ? `<p class="muted" style="margin:0">No está en el catálogo 2025–2026. Agrégalo a mano.</p>` : "");
      };
      sc.oninput = draw; sc.focus();
    }
    out.onclick = async e => {
      const b = e.target.closest("button"); if(!b) return;
      if(b.dataset.found){ const c = state.cars.find(x=>x.id===b.dataset.found); openForm(Object.assign({},c,{status:"owned",qty:1,date:new Date().toISOString().slice(0,10)}),"¡Felicidades! Completa los datos de la compra"); }
      if(b.dataset.open2) openDetail(b.dataset.open2);
      if(b.dataset.plus){ const c = state.cars.find(x=>x.id===b.dataset.plus); await store.put(Object.assign({},c,{qty:num(c.qty||1)+1})); closeSheet(); toast("Ahora tienes "+(num(c.qty||1)+1)+" de "+c.name); }
      if(b.dataset.pick){ const base = carFromCatalog(CATALOG[+b.dataset.pick], "owned"); const patch = isUPC?{barcode:k}:{code:k}; return openForm(Object.assign(base, patch, base.id?{}:{qty:1, date:new Date().toISOString().slice(0,10)}), "Agregar a mi garaje", {quick:true, again:true}); }
      if(b.dataset.add) openForm(Object.assign({status: b.dataset.add==="wish"?"wish":"owned"}, isUPC?{barcode:k}:{code:k}));
    };
  }
}

async function saveFile(filename, data){
  let dl = null; try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(e){}
  if(!dl){
    const type = filename.endsWith(".csv") ? "text/csv" : "application/json";
    try{
      const file = new File([data], filename, {type});
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:filename}); toast("Elige “Guardar en Archivos” para conservarlo"); return; }
    }catch(e){ if(e && e.name==="AbortError") return; }
    try{
      const url = URL.createObjectURL(new Blob([data], {type}));
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000); toast("Archivo descargado");
    }catch(e){ toast("No se pudo guardar el archivo"); }
    return;
  }
  try{ const r = await dl.save({filename, data}); if(r && r.status==="saved") toast("Archivo guardado"); }
  catch(e){ if(e && e.code!=="cancelled" && e.code!=="declined") toast("No se pudo guardar el archivo"); }
}
function stamp(){ return new Date().toISOString().slice(0,10); }
function exportJson(){ saveFile(`garaje64-respaldo-${stamp()}.json`, JSON.stringify({app:"Garaje 64", version:1, exported:new Date().toISOString(), lists:state.lists, cars:state.cars}, null, 1)); }
function exportCsv(){
  const cols = [["name","Nombre"],["series","Serie"],["year","Año"],["caseLetter","Case"],["colNum","N.º colección"],["code","Toy #"],["barcode","Código de barras"],["color","Color"],["th","TH/STH"],["status","Estado colección"],["condition","Empaque"],["quality","Condición"],["qty","Cantidad"],["price","Pagado"],["value","Valor estimado"],["store","Tienda"],["date","Fecha"],["location","Ubicación"],["lists","Listas"],["trade","Intercambio"],["notes","Notas"]];
  const cell = v => { const s = Array.isArray(v)? v.join(" | ") : v===true?"Sí":v===false?"No":String(v??""); return /[",\n;]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const rows = [cols.map(c=>c[1]).join(","), ...state.cars.map(c=>cols.map(([k])=>cell(k==="status"?(c.status==="wish"?"Wishlist":"Tengo"):c[k])).join(","))];
  saveFile(`garaje64-${stamp()}.csv`, "﻿" + rows.join("\n"));
}
async function importJson(file){
  if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    const cars = Array.isArray(data) ? data : data.cars;
    if(!Array.isArray(cars)) throw new Error("formato");
    const have = new Set(state.cars.map(c=>c.id));
    const add = cars.filter(c=>c && c.id && c.name && !have.has(c.id));
    if(Array.isArray(data.lists)){ const nl=[...new Set([...state.lists, ...data.lists])]; await store.setMeta({lists:nl}); }
    await store.putMany(add);
    toast(`Importados ${add.length} autos`);
  }catch(e){ toast("El archivo no es un respaldo válido de Garaje 64."); }
}
async function copyLocalTo(target){
  const db = await getCloud();
  if(!db || (target==="cuenta" && !(await getUserId()))) return toast("Abre la app con tu sesión de claude.ai iniciada para guardar en tu cuenta.");
  const local = LocalStore(); const cars = (await local.all()).filter(c=>!c.example); const meta = await local.getMeta();
  if(!cars.length){ ls.set("g64.migrated", true); if(target!==state.mode){ ls.set("g64.mode2", target); await setMode(target); } return toast("No hay autos propios en este navegador para pasar."); }
  const dest = makeStore(target, db);
  toast(`Pasando ${cars.length} autos…`);
  try{
    const cur = await dest.fetchMeta(); const cl = (cur && cur.lists) || [];
    await dest.setMeta({lists:[...new Set([...cl, ...((meta&&meta.lists)||[])])]});
    await dest.putMany(cars);
    ls.set("g64.migrated", true); ls.set("g64.mode2", target);
    await setMode(target);
    toast(`Listo: ${cars.length} autos guardados en ${target==="cuenta"?"tu cuenta":"la colección compartida"}`);
  }catch(e){ toast("No se pudo pasar: "+(e.message||e.code)); }
}

  const uid = db ? await getUserId() : null;
  let mode = uid ? "cuenta" : "local";
  if(pref === "cloud" && db) mode = "cloud";
  if(pref === "local") mode = "local";
  await setMode(mode, true);
})();
</script>
